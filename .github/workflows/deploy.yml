# Build static site and deploy to Cloudflare Pages (Direct Upload via Wrangler).
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Custom API Token: Account → Cloudflare Pages → Edit
#                            Prefer creating under Account API Tokens if available.
#   CLOUDFLARE_ACCOUNT_ID  — Account ID (dashboard URL …/dash.cloudflare.com/<ID>/… or Overview → API)
#
# Optional Variable:
#   CLOUDFLARE_PROJECT_NAME — default: website (must match Pages project name)
#
# Official token steps:
#   https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  # false: avoid canceling an in-flight deploy mid-retry (looks like "Error: The operation was canceled.")
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on Actions runners; match engines in package.json
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Resolve project name
        id: proj
        run: |
          name="${PAGES_PROJECT:-website}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Deploy target project: $name"

      - name: Verify dist artifact
        run: |
          set -euo pipefail
          echo "PWD=$(pwd)"
          ls -la
          test -d dist || { echo "::error::dist/ missing after artifact download"; exit 1; }
          ls -la dist | head -40
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          echo "dist OK ($(du -sh dist | awk '{print $1}'))"

      - name: Install Wrangler
        run: |
          set -euo pipefail
          # Install globally so full Wrangler stderr is visible in the job log
          npm install -g wrangler@4
          wrangler --version
          which wrangler

      - name: Verify Cloudflare API credentials
        id: cfcheck
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is empty or missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is empty or missing."
            exit 1
          fi
          # Length only — never print the token
          echo "Token length: ${#CLOUDFLARE_API_TOKEN} (should be > 20)"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID} (hex, usually 32)"
          echo "Note: 521/522 HTML from api.cloudflare.com = path from this runner → Cloudflare API is broken (not dist/)."

          # Network path diagnostics (no secrets)
          echo "=== DNS / connectivity (api.cloudflare.com) ==="
          getent ahosts api.cloudflare.com | head -10 || true
          # Prefer IPv4: some Actions paths misbehave on v6 to CF edges
          CURL_IP=(-4)
          curl "${CURL_IP[@]}" -sS -o /dev/null -w "curl -4 HEAD api.cloudflare.com → HTTP %{http_code} time=%{time_total}s\n" \
            --connect-timeout 15 --max-time 30 -I "https://api.cloudflare.com/" || echo "curl -4 HEAD failed"
          curl -sS -o /dev/null -w "curl dualstack HEAD api.cloudflare.com → HTTP %{http_code} time=%{time_total}s\n" \
            --connect-timeout 15 --max-time 30 -I "https://api.cloudflare.com/" || echo "curl dualstack HEAD failed"

          # 1) Token verify (lighter than Pages list)
          echo "=== Token verify ==="
          for attempt in 1 2 3 4 5 6; do
            code=$(curl "${CURL_IP[@]}" -sS -o /tmp/cf-token.json -w "%{http_code}" \
              --connect-timeout 20 --max-time 90 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)
            echo "tokens/verify attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              python3 - <<'PY'
          import json
          d=json.load(open("/tmp/cf-token.json"))
          print("token verify success=", d.get("success"), "status=", (d.get("result") or {}).get("status"))
          print("errors=", d.get("errors"))
          PY
              break
            fi
            case "$code" in
              520|521|522|523|524|502|503|504)
                sleep $((attempt * 10))
                continue
                ;;
            esac
            # 401/403 still parseable — show body tip
            head -c 200 /tmp/cf-token.json; echo
            break
          done

          # 2) List Pages projects (what wrangler also hits)
          echo "=== List Pages projects ==="
          code=""
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl "${CURL_IP[@]}" -sS -o /tmp/cf-pages.json -w "%{http_code}" \
              --connect-timeout 20 --max-time 90 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" || true)
            echo "list-projects attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              break
            fi
            case "$code" in
              520|521|522|523|524|502|503|504)
                echo "Transient Cloudflare edge/API error ${code}; sleeping…"
                sleep $((attempt * 12))
                continue
                ;;
            esac
            break
          done

          WANT="${{ steps.proj.outputs.name }}"
          export WANT
          python3 - <<'PY'
          import json, os, sys
          raw = open("/tmp/cf-pages.json", "rb").read()[:240]
          try:
              d = json.load(open("/tmp/cf-pages.json"))
          except Exception as e:
              print("Could not parse list-projects response:", e)
              print("Body starts with:", raw[:200])
              print("==> Conclusion: GitHub Actions cannot reach Cloudflare Pages API reliably (521/522).")
              print("    Your secrets look present (lengths OK). This is NOT a static-site build bug.")
              print("    Next: (1) https://www.cloudflarestatus.com/  (2) re-run later  (3) deploy from your Mac:")
              print("      npx wrangler@4 pages deploy dist --project-name=website")
              sys.exit(1)
          print("api.success =", d.get("success"))
          print("api.errors  =", d.get("errors"))
          names = [p.get("name") for p in (d.get("result") or [])]
          print("pages projects visible to this token:", names or "(none)")
          if not d.get("success"):
              sys.exit(2)
          want = os.environ.get("WANT", "website")
          exists = want in names
          print(f"target project {want!r} exists =", exists)
          open("/tmp/cf-project-exists", "w").write("true" if exists else "false")
          PY

          if [ "$code" != "200" ]; then
            case "$code" in
              520|521|522|523|524|502|503|504)
                echo "::error::Cloudflare API still HTTP ${code} after retries from this runner. Site code is fine; wait/re-run or deploy from local network. Status: https://www.cloudflarestatus.com/"
                exit 1
                ;;
            esac
            echo "::error::Cloudflare rejected credentials (HTTP ${code}). Create Token: Account | Cloudflare Pages | Edit on this account."
            exit 1
          fi

          exists=$(cat /tmp/cf-project-exists)
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Wrangler whoami (debug)
        run: |
          set -euo pipefail
          echo "=== wrangler whoami ==="
          wrangler whoami || true

      - name: Create Pages project if missing
        if: steps.cfcheck.outputs.exists != 'true'
        env:
          PROJECT_NAME: ${{ steps.proj.outputs.name }}
        run: |
          set -euo pipefail
          echo "Creating Pages project: ${PROJECT_NAME}"
          wrangler pages project create "${PROJECT_NAME}" --production-branch=main

      - name: Deploy to Cloudflare Pages
        env:
          PROJECT_NAME: ${{ steps.proj.outputs.name }}
        run: |
          set -euo pipefail
          echo "Deploying dist/ → project=${PROJECT_NAME} account=${CLOUDFLARE_ACCOUNT_ID:0:6}…"
          # Note: after `if cmd; then …; fi`, $? is often 0 even when cmd failed — capture status inside else.
          attempt=1
          max=5
          while [ "$attempt" -le "$max" ]; do
            echo "=== pages deploy attempt ${attempt}/${max} ==="
            set +e
            wrangler pages deploy dist \
              --project-name="${PROJECT_NAME}" \
              --branch=main \
              --commit-dirty=true
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Deploy succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Deploy attempt ${attempt} failed (exit ${status})"
            if [ "$attempt" -eq "$max" ]; then
              echo "::error::wrangler pages deploy failed after ${max} attempts."
              echo "If you saw GET …/pages/projects/${PROJECT_NAME} -> 521/522 + HTML: Cloudflare API edge problem, not your dist/ contents."
              echo "If Authentication / 10000: fix CLOUDFLARE_API_TOKEN (Pages Edit) or ACCOUNT_ID."
              echo "If Project not found: create project 'website' in dashboard or set Variable CLOUDFLARE_PROJECT_NAME."
              exit "$status"
            fi
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
